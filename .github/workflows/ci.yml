name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # The migrations create the pgvector extension. A service container cannot be built from postgres/Dockerfile, so
        # CI uses the upstream image with pgvector (Debian); the stack itself runs the Alpine build of the same version.
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: davos_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["63799:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: lint-imports
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:54329/davos_test
          TEST_REDIS_URL: redis://localhost:63799/0

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r backend/requirements.lock --strict

  image:
    runs-on: ubuntu-24.04
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t davos-backend:ci backend
      - run: docker compose --env-file .env.example config --quiet
