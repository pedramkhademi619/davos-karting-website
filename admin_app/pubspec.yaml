name: davos_admin
description: "اپلیکیشن مدیریت داووس کارتینگ"
# Private package; never published.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

# Same libraries as the Vesta admin app (GetX for state/navigation/DI, Dio for HTTP, GetStorage + secure storage for
# persistence, fl_chart for charts, shamsi_date for the Jalali calendar).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.2
  get_storage: ^2.1.1
  dio: ^5.9.0
  fl_chart: ^0.69.0
  flutter_secure_storage: ^10.0.0
  flutter_spinkit: ^5.2.2
  shamsi_date: ^1.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Noto Sans Arabic (SIL OFL): Persian letters and digits.
    - family: noto
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    # Latin letters, digits and punctuation ("/", "(", English text).
    - family: noto_latin
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
