# Davos Karting - single-host deployment topology.
# Development:  cp .env.example .env && docker compose up --build
# Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   (see docs/DEPLOYMENT.md)
name: davos

x-backend-image: &backend-image
  image: davos-backend:${DAVOS_VERSION:-dev}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost"]}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-davos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-davos}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?set OTP_HMAC_SECRET in .env}
  SESSION_CSRF_SECRET: ${SESSION_CSRF_SECRET:?set SESSION_CSRF_SECRET in .env}
  BOOKING_WEBHOOK_SECRET: ${BOOKING_WEBHOOK_SECRET:?set BOOKING_WEBHOOK_SECRET in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DEV_SMS_ECHO_ENABLED: ${DEV_SMS_ECHO_ENABLED:-false}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  BOOKING_BASE_URL: ${BOOKING_BASE_URL:-}
  ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
  PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-}
  AI_TOKEN_LIMIT_PARAM: ${AI_TOKEN_LIMIT_PARAM:-max_tokens}
  AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-400000}
  BOOKING_INTEGRATION_ENABLED: ${BOOKING_INTEGRATION_ENABLED:-false}
  PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
  ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
  AI_SEND_TEMPERATURE: ${AI_SEND_TEMPERATURE:-true}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-400}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-12}
  AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
  AI_FALLBACK_TOKEN_LIMIT_PARAM: ${AI_FALLBACK_TOKEN_LIMIT_PARAM:-max_tokens}
  AI_FALLBACK_SEND_TEMPERATURE: ${AI_FALLBACK_SEND_TEMPERATURE:-true}
  AI_FALLBACK_MIN_OUTPUT_TOKENS: ${AI_FALLBACK_MIN_OUTPUT_TOKENS:-0}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mellat}
  MELLAT_TERMINAL_ID: ${MELLAT_TERMINAL_ID:-0}
  MELLAT_USERNAME: ${MELLAT_USERNAME:-}
  MELLAT_PASSWORD: ${MELLAT_PASSWORD:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-recording}
  KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
  KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
  KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-}
  KAVENEGAR_RESERVATION_TEMPLATE: ${KAVENEGAR_RESERVATION_TEMPLATE:-}
  ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
  ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
  OTP_REQUESTS_PER_IP_PER_HOUR: ${OTP_REQUESTS_PER_IP_PER_HOUR:-200}
  OTP_VERIFICATIONS_PER_IP_PER_15_MINUTES: ${OTP_VERIFICATIONS_PER_IP_PER_15_MINUTES:-300}
  ASSISTANT_QUESTIONS_PER_IP_PER_HOUR: ${ASSISTANT_QUESTIONS_PER_IP_PER_HOUR:-120}

services:
  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27.2-alpine
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 15s
      timeout: 4s
      retries: 3
    networks: [edge]
    restart: unless-stopped
    mem_limit: 256m  # includes the tmpfs page caches
    <<: *hardening

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the web app at build time: where the main site and the booking subdomain live.
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:-http://localhost}
        NEXT_PUBLIC_BOOKING_URL: ${BOOKING_BASE_URL:-}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
    # Every page is rendered per request (it carries its own CSP nonce) and one Node.js process renders one page at a
    # time, so the web app runs as several replicas; nginx spreads requests over them (see nginx/nginx.conf).
    deploy:
      replicas: ${FRONTEND_REPLICAS:-3}
    networks: [edge]
    restart: unless-stopped
    mem_limit: 384m

  api:
    <<: [*backend-image, *hardening]
    image: davos-api:${DAVOS_VERSION:-dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *app-environment
      FORWARDED_ALLOW_IPS: "*"  # the API is reachable only from the proxy on the private edge network
      # Worker processes (uvicorn reads WEB_CONCURRENCY). Each keeps DB_POOL_SIZE + DB_MAX_OVERFLOW connections at most;
      # keep API_WORKERS x (pool + overflow) + worker/scheduler well under PostgreSQL's max_connections (100).
      WEB_CONCURRENCY: ${API_WORKERS:-4}
      # Owner-editable assistant content (see backend/knowledge/README.md); mounted read-only from the host below.
      ASSISTANT_PERSONA_FILE: /app/prompts/assistant_persona.txt
      ASSISTANT_KNOWLEDGE_DIR: /app/knowledge
    volumes:
      - ./backend/prompts:/app/prompts:ro
      - ./backend/knowledge:/app/knowledge:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [edge, backend]
    restart: unless-stopped
    mem_limit: 1g
    stop_grace_period: 30s

  # One-shot, explicit migration job: replicas never migrate on their own start-up.
  migrate:
    <<: [*backend-image, *hardening]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    healthcheck:
      disable: true

  worker:
    <<: [*backend-image, *hardening]
    # Queues are isolated; to scale them independently run extra workers with a single -Q each.
    command: ["celery", "-A", "davos.worker.celery_app.celery_app", "worker", "-Q", "critical,sms,ai,export", "-c", "4", "--loglevel=INFO"]
    environment:
      <<: *app-environment
      # The daily cache purge works out the "current" answer fingerprint, which includes the persona text: it must read
      # the same file as the API. (The purge is also written so a wrong fingerprint cannot remove entries still in use.)
      ASSISTANT_PERSONA_FILE: /app/prompts/assistant_persona.txt
    volumes:
      - ./backend/prompts:/app/prompts:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A davos.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 60s

  # Exactly one scheduler: never scale this service (duplicate beat processes duplicate scheduled jobs).
  scheduler:
    <<: [*backend-image, *hardening]
    command: ["celery", "-A", "davos.worker.celery_app.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *app-environment
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      replicas: 1
    networks: [backend]
    restart: unless-stopped
    mem_limit: 128m

  postgres:
    # postgres:16.4-alpine plus the pgvector extension (see postgres/Dockerfile). Same base image and libc as before, so
    # an existing data volume keeps working and its text ordering does not change.
    build: ./postgres
    image: davos-postgres:16.4-pgvector0.8.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-davos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-davos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    restart: unless-stopped
    mem_limit: 256m

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z  # Docker Hub no longer hosts MinIO images
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m

networks:
  edge: {}
  backend:
    internal: true  # database, cache and object storage have no route to or from the internet

volumes:
  pgdata:
  redisdata:
  miniodata:
