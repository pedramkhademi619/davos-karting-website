# Development conveniences, merged automatically by `docker compose up`.
# Not used in production (docker-compose.prod.yml is applied explicitly there).
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  minio:
    ports:
      - "127.0.0.1:9001:9001"
  api:
    ports:
      - "127.0.0.1:8000:8000"
    networks: [edge, backend]
