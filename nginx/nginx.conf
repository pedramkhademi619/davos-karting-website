worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Coarse edge limits; the API applies precise per-mobile / per-IP limits in Redis behind these. They are generous on
    # purpose: Iranian mobile operators put very many customers behind one public IP (carrier-grade NAT).
    limit_req_zone $binary_remote_addr zone=otp:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=public:10m rate=60r/s;
    limit_req_status 429;

    # Micro-cache for the public seat map, calendar and booking facts: every visitor polls them, and 2 seconds of
    # staleness is harmless because holding karts re-checks under a database lock. Nothing personal is ever cached.
    proxy_cache_path /tmp/cache_public levels=1:2 keys_zone=public_api:10m max_size=16m inactive=2m use_temp_path=off;
    # Next.js build assets are content-hashed and immutable.
    proxy_cache_path /tmp/cache_static levels=1:2 keys_zone=static_files:10m max_size=96m inactive=7d use_temp_path=off;

    # Query strings can carry phone numbers or tokens, so the access log records the path only ($uri, never $request).
    # rid matches the request_id in the API's own (masked) log lines.
    log_format davos '$remote_addr [$time_local] "$request_method $host $uri" $status $body_bytes_sent rid=$request_id cache=$upstream_cache_status "$http_user_agent"';
    access_log /var/log/nginx/access.log davos;

    # Docker's DNS, re-asked every 10 s: the web app runs as several replicas (FRONTEND_REPLICAS) and nginx spreads
    # requests over every address it returns; a restarted container's new address is picked up without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # One server for both hosts: the main site and the booking subdomain (BOOKING_BASE_URL). The web app decides
    # which pages belong to which host; /api is the same API on both, so each host calls its own origin.
    server {
        listen 8080;
        server_name _;

        set $api_backend http://api:8000;
        set $web_backend http://frontend:3000;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Operational endpoints are reachable only inside the compose network.
        location = /api/v1/health/ready { return 404; }
        location /api/docs { return 404; }
        location /api/openapi.json { return 404; }

        location /api/v1/auth/otp/ {
            limit_req zone=otp burst=20 nodelay;
            proxy_pass $api_backend;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/reservations/(availability|calendar|info)$ {
            limit_req zone=public burst=120 nodelay;
            proxy_cache public_api;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$uri$is_args$args";
            proxy_cache_valid 200 2s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 3s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_ignore_headers Cache-Control Expires;
            add_header X-Cache $upstream_cache_status always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass $api_backend;
            include /etc/nginx/proxy_params;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass $api_backend;
            include /etc/nginx/proxy_params;
        }

        location /_next/static/ {
            proxy_cache static_files;
            proxy_cache_valid 200 7d;
            proxy_cache_lock on;
            proxy_pass $web_backend;
            include /etc/nginx/proxy_params;
        }

        location / {
            proxy_pass $web_backend;
            include /etc/nginx/proxy_params;
        }
    }
}
