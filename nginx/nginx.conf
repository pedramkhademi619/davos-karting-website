worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Coarse edge limits; the API applies precise per-mobile / per-IP limits in Redis behind these.
    limit_req_zone $binary_remote_addr zone=otp:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # Query strings can carry phone numbers or tokens, so the access log records the path only ($uri, never $request).
    # rid matches the request_id in the API's own (masked) log lines.
    log_format davos '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent rid=$request_id "$http_user_agent"';
    access_log /var/log/nginx/access.log davos;

    upstream api_upstream {
        server api:8000;
        keepalive 16;
    }

    upstream web_upstream {
        server frontend:3000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Operational endpoints are reachable only inside the compose network.
        location = /api/v1/health/ready { return 404; }
        location /api/docs { return 404; }
        location /api/openapi.json { return 404; }

        location /api/v1/auth/otp/ {
            limit_req zone=otp burst=5 nodelay;
            proxy_pass http://api_upstream;
            include /etc/nginx/proxy_params;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_upstream;
            include /etc/nginx/proxy_params;
        }

        location / {
            proxy_pass http://web_upstream;
            include /etc/nginx/proxy_params;
        }
    }
}
