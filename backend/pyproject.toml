[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "davos"
version = "0.1.0"
description = "Davos Karting backend - modular monolith (hexagonal architecture)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.53,<0.54",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "asyncpg>=0.31,<0.32",
  "alembic>=1.20,<1.21",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.15,<2.16",
  "argon2-cffi>=25.1,<26",
  "pyotp>=2.10,<3",
  "httpx>=0.28,<0.29",
  "redis>=8.1,<9",
  "celery>=5.6,<5.7",
  "pgvector>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7",
  "respx>=0.23,<0.24",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
  "import-linter>=2.15,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "C4", "SIM", "RUF", "S", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Persian text is intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: needs real PostgreSQL/Redis (see tests/integration/conftest.py)",
]

[tool.importlinter]
root_package = "davos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layers are framework-free"
type = "forbidden"
source_modules = [
  "davos.shared_kernel.domain",
  "davos.modules.identity.domain",
  "davos.modules.assistant.domain",
  "davos.modules.loyalty.domain",
  "davos.modules.payments.domain",
  "davos.modules.booking.domain",
]
forbidden_modules = ["fastapi", "sqlalchemy", "redis", "httpx", "celery", "pydantic", "davos.platform"]

[[tool.importlinter.contracts]]
name = "Application layers depend on domain and ports only"
type = "forbidden"
source_modules = [
  "davos.shared_kernel.application",
  "davos.modules.identity.application",
  "davos.modules.assistant.application",
  "davos.modules.notifications.application",
  "davos.modules.loyalty.application",
  "davos.modules.payments.application",
  "davos.modules.booking.application",
]
forbidden_modules = ["fastapi", "sqlalchemy", "redis", "httpx", "celery", "davos.platform"]

[[tool.importlinter.contracts]]
name = "Inside each module: adapters -> application -> domain, never the reverse"
type = "layers"
containers = [
  "davos.modules.identity",
  "davos.modules.assistant",
  "davos.modules.notifications",
  "davos.modules.loyalty",
  "davos.modules.payments",
  "davos.modules.booking",
]
layers = ["adapters", "application", "(domain)"]

[[tool.importlinter.contracts]]
name = "Modules are independent of each other (talk through ports, events or composition)"
type = "independence"
modules = [
  "davos.modules.identity",
  "davos.modules.assistant",
  "davos.modules.notifications",
  "davos.modules.loyalty",
  "davos.modules.payments",
  "davos.modules.booking",
]

[[tool.importlinter.contracts]]
name = "Modules never depend on the composition root or the API"
type = "forbidden"
source_modules = ["davos.modules", "davos.shared_kernel", "davos.platform"]
forbidden_modules = ["davos.composition", "davos.api"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "davos.worker.tasks"
disallow_untyped_decorators = false  # Celery ships no type information
