# /etc/nginx/conf.d/davoskarting.ir.conf on the demo server: the main domain, www, and the booking., admin. and game.
# subdomains, all behind the one proxy on 127.0.0.1:8090 (it routes by Host). Certificates are Let's Encrypt, issued and
# renewed by certbot with the webroot below (this server is a Fedora 34 with no certbot package: it lives in a Python
# virtualenv, /opt/certbot, and a systemd timer renews it).
#   * the main domain + www:  /etc/letsencrypt/live/davoskarting.ir/
#   * booking. admin. game.:  /etc/letsencrypt/live/davoskarting-sub/
# Then: nginx -t && systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name davoskarting.ir www.davoskarting.ir booking.davoskarting.ir admin.davoskarting.ir game.davoskarting.ir;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# www is only an alias: one address per page (the main domain) so Google does not see two copies of the site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.davoskarting.ir;
    ssl_certificate     /etc/letsencrypt/live/davoskarting.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/davoskarting.ir/privkey.pem;
    return 301 https://davoskarting.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name davoskarting.ir;

    ssl_certificate     /etc/letsencrypt/live/davoskarting.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/davoskarting.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 10M;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # e-Namad's ownership check: an empty file at the site root (the panel shows the name in Persian digits, so both).
    location = /19807605.txt {
        default_type text/plain;
        return 200 "";
    }
    location = /۱۹۸۰۷۶۰۵.txt {
        default_type text/plain;
        return 200 "";
    }

    # The demo's pretend bank page (not a real bank). Only these two paths are reachable from outside.
    location = /demo-bank/pay {
        proxy_pass http://127.0.0.1:9099/pay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /demo-bank/finish {
        proxy_pass http://127.0.0.1:9099/finish;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}

