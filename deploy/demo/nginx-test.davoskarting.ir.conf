# /etc/nginx/conf.d/test.davoskarting.ir.conf on the demo server. Needs a certificate for the name first (Cloudflare origin
# certificate, or Let's Encrypt via certbot) at the two paths below, then: nginx -t && systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name test.davoskarting.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.davoskarting.ir;

    ssl_certificate     /etc/ssl/cloudflare/test.davoskarting.ir/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/test.davoskarting.ir/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 10M;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The demo's pretend bank page (not a real bank). Only these two paths are reachable from outside.
    location = /demo-bank/pay {
        proxy_pass http://127.0.0.1:9099/pay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /demo-bank/finish {
        proxy_pass http://127.0.0.1:9099/finish;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
